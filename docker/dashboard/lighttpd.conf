# mrefd dashboard - additive lighttpd overrides.
#
# Debian's stock /etc/lighttpd/lighttpd.conf already sets:
#   - server.document-root = "/var/www/html"
#   - server.port          = 80
#   - server.use-ipv6      = "enable"        (dual-stack bind on newer Debian)
#   - index-file.names     includes index.php and index.html
#   - mimetype.assign      populated via include_shell of create-mime.assign.pl
#
# Redeclaring any of those causes lighttpd to abort with "Duplicate config
# variable in conditional 0 global: ..." (or, for mimetype.assign, floods
# the log with array-key duplicate warnings). Reported by Tom @ etherham.com.
#
# Anything the mrefd dashboard needs beyond Debian's defaults should be added
# below with the array-append operator (+=) or in a $SERVER["socket"] block,
# not with a bare = that would shadow the stock config.

# (Currently no site-specific overrides are needed.)
