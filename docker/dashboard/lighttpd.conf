# mrefd dashboard - lighttpd server config
# Listens on IPv4 and IPv6 (both wildcards).

server.document-root      = "/var/www/html"
server.port               = 80
# IPv6 wildcard; IPv4 is already covered by the default bind.
$SERVER["socket"] == "[::]:80" { }

index-file.names          = ( "index.php", "index.html" )
mimetype.assign           = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".svg"  => "image/svg+xml",
    ".woff" => "font/woff",
    ".woff2"=> "font/woff2",
    ".ttf"  => "font/ttf",
)
